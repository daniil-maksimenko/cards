<script>
/* ==========================================================================
   ЛОГИКА
   Без библиотек. Прогресс хранится в localStorage этого браузера.
   ========================================================================== */
(function () {
  'use strict';

  /* ---------- Мелочи ---------- */
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const shuffle = (list) => {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };
  const plural = (n, one, few, many) => {
    const d = n % 10, h = n % 100;
    if (d === 1 && h !== 11) return one;
    if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return few;
    return many;
  };
  const words = (n) => n + ' ' + plural(n, 'слово', 'слова', 'слов');
  const clock = (sec) => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  const media = (q) => (window.matchMedia ? window.matchMedia(q) : { matches: false });
  const calm = media('(prefers-reduced-motion: reduce)');
  const wide = media('(min-width: 980px)');

  const ICON = {
    close: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    undo: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8.5 13.5L4 9l4.5-4.5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>',
    arrow: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4.5 12h15M13.5 6l6 6-6 6"/></svg>',
    check: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    cross: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
    tick: '<svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.2 6.4l2.5 2.5 5.1-5.6"/></svg>',
    speak: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 9.5v5h3.4L12 18V6L7.4 9.5H4z"/><path d="M15.4 9.2a4 4 0 010 5.6M17.9 6.7a7.5 7.5 0 010 10.6"/></svg>',
    search: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>'
  };

  /* Значок состояния — крошечный ярлык */
  const STATUS = { ok: 'Знаю', sep: 'Учу', ven: 'Трудное', new: 'Новое' };
  const STATUS_MANY = { ok: 'Знаю', sep: 'Учу', ven: 'Трудные', new: 'Новые' };
  function mark(st) {
    const shape = 'M4.5.5h15l4 4v7l-4 4h-15l-4-4v-7z';
    const body = {
      ok: '<path d="' + shape + '" fill="#F4EEDC"/><path d="M7 8h10" stroke="#17150F" stroke-width="2"/>',
      sep: '<path d="' + shape + '" fill="#F4EEDC"/><path d="M7 8h10" stroke="#B82A1E" stroke-width="2"/>',
      ven: '<path d="' + shape + '" fill="#151410" stroke="#F4EEDC"/><path d="M7 8h10" stroke="#F4EEDC" stroke-width="2"/>',
      new: '<path d="' + shape + '" fill="none" stroke="#A9C4B7" stroke-dasharray="2 2"/>'
    }[st];
    return '<svg class="mark" viewBox="0 0 24 16" aria-hidden="true">' + body + '</svg>';
  }

  /* ---------- Слова ---------- */
  const TOPICS = Array.isArray(window.WORTSCHATZ) ? window.WORTSCHATZ : [];

  const normRu = (s) => String(s).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();

  /* Грубо определяем часть речи, чтобы в тесте не стояли рядом глагол и прилагательное */
  function kindOf(de, ru) {
    if (/^(der|die|das) [A-ZÄÖÜ]\S*$/.test(de)) return 'n';
    const first = ru.replace(/^\d\)\s*/, '').replace(/[()]/g, '').split(/[\s,;]+/).slice(0, 2);
    if (first.some((w) => /(ть|ться|тись|сти|чь)$/.test(w))) return 'v';
    if (/^(der|die|das|ein|eine|den) |^[A-ZÄÖÜ]/.test(de)) return 'n';
    return 'a';
  }

  const CARDS = [];
  TOPICS.forEach((topic, ti) => {
    (topic.words || []).forEach((w, wi) => {
      if (!Array.isArray(w) || !w[1] || !w[3]) return;
      const de = String(w[1]).trim();
      const note = String(w[2] || '').trim();
      const ru = String(w[3]).trim();
      const noun = /^(der|die|das) ([A-ZÄÖÜ][A-Za-zÄÖÜäöüß-]*)$/.exec(de);
      CARDS.push({
        id: topic.id + ':' + wi,
        key: de.toLowerCase(),
        t: ti,
        topic: topic,
        n: w[0],
        de: de,
        note: note,
        ru: ru,
        ruKey: normRu(ru),
        extra: Array.isArray(w[4]) ? w[4] : [],
        art: noun && !/Plural/i.test(note) ? noun[1] : null,
        bare: noun ? noun[2] : null,
        kind: kindOf(de, ru)
      });
    });
  });
  /* der Verwandte / die Verwandte: артикль не угадать, в «Артикли» не берём */
  (function () {
    const seen = {};
    CARDS.forEach((c) => { if (c.art) (seen[c.bare] = seen[c.bare] || new Set()).add(c.art); });
    CARDS.forEach((c) => { if (c.art && seen[c.bare].size > 1) c.art = null; });
  })();
  const byId = {};
  CARDS.forEach((c) => { byId[c.id] = c; });

  /* ---------- Хранилище ---------- */
  const KEY = 'wortapotheke:v1';
  const SIZES = [10, 20, 30, 50];
  let persistent = true;
  try {
    localStorage.setItem(KEY + ':probe', '1');
    localStorage.removeItem(KEY + ':probe');
  } catch (e) { persistent = false; }

  function blank() {
    return { v: 1, set: { off: [], dir: 'de', size: 20, speak: false }, prog: {}, days: {}, best: {} };
  }
  function adopt(data) {
    const s = blank();
    if (!data || typeof data !== 'object') return s;
    const set = data.set || {};
    if (Array.isArray(set.off)) s.set.off = set.off.filter((id) => TOPICS.some((t) => t.id === id));
    if (['de', 'ru', 'mix'].includes(set.dir)) s.set.dir = set.dir;
    if (SIZES.includes(set.size)) s.set.size = set.size;
    s.set.speak = !!set.speak;
    if (data.prog && typeof data.prog === 'object') {
      Object.keys(data.prog).forEach((k) => {
        const r = data.prog[k];
        if (!r || typeof r !== 'object') return;
        s.prog[k] = { n: +r.n || 0, c: +r.c || 0, x: +r.x || 0, s: +r.s || 0, h: r.h ? 1 : 0, t: +r.t || 0, a: +r.a || 0 };
      });
    }
    if (data.days && typeof data.days === 'object') {
      Object.keys(data.days).forEach((d) => { if (/^\d{4}-\d\d-\d\d$/.test(d) && +data.days[d] > 0) s.days[d] = +data.days[d]; });
    }
    if (data.best && typeof data.best === 'object') {
      Object.keys(data.best).forEach((k) => { if (+data.best[k] > 0) s.best[k] = +data.best[k]; });
    }
    return s;
  }
  function load() {
    if (!persistent) return blank();
    try { return adopt(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { return blank(); }
  }
  function save() {
    if (!persistent) return;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) { persistent = false; }
  }
  let store = load();

  /* ---------- Прогресс ----------
     Верный ответ — слово «знаю». Ошибка — «трудное». После ошибки нужно
     два верных ответа подряд: после первого слово «учу», после второго снова «знаю». */
  const rec = (card) => store.prog[card.key];
  function statusOf(card) {
    const r = rec(card);
    if (!r || !r.n) return 'new';
    if (r.h) return r.s >= 1 ? 'sep' : 'ven';
    return 'ok';
  }
  const paperOf = (st) => (st === 'sep' || st === 'ven' ? st : 'ok');

  function dayKey(date) {
    const d = date || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function bumpDay(by) {
    const k = dayKey();
    store.days[k] = Math.max(0, (store.days[k] || 0) + by);
    if (!store.days[k]) delete store.days[k];
  }
  function streak() {
    const d = new Date();
    if (!store.days[dayKey(d)]) d.setDate(d.getDate() - 1);
    let n = 0;
    while (store.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  function grade(card, ok) {
    const before = rec(card) ? Object.assign({}, rec(card)) : null;
    const r = store.prog[card.key] || (store.prog[card.key] = { n: 0, c: 0, x: 0, s: 0, h: 0, t: 0, a: 0 });
    r.n++;
    r.t = Date.now();
    if (ok) {
      r.c++;
      r.s++;
      if (r.h && r.s >= 2) r.h = 0;
    } else {
      r.x++;
      r.s = 0;
      r.h = 1;
    }
    bumpDay(1);
    save();
    return before;
  }
  function ungrade(card, before) {
    if (before) store.prog[card.key] = before; else delete store.prog[card.key];
    bumpDay(-1);
    save();
  }
  /* Артикли считаем отдельно: знать род — ещё не значит знать слово */
  function gradeArticle(card, ok) {
    const r = store.prog[card.key] || (store.prog[card.key] = { n: 0, c: 0, x: 0, s: 0, h: 0, t: 0, a: 0 });
    r.a = ok ? Math.max(0, r.a || 0) + 1 : -1;
    bumpDay(1);
    save();
  }
  function tally(cards) {
    const t = { ok: 0, sep: 0, ven: 0, new: 0, all: cards.length };
    cards.forEach((c) => { t[statusOf(c)]++; });
    return t;
  }

  /* ---------- Выбор слов ---------- */
  const isOn = (topic) => !store.set.off.includes(topic.id);
  const pool = () => CARDS.filter((c) => isOn(c.topic));
  function unique(cards) {
    const seen = new Set();
    return cards.filter((c) => (seen.has(c.key) ? false : (seen.add(c.key), true)));
  }
  const size = () => store.set.size;
  /* одно и то же слово может стоять в нескольких темах; прогресс у него один */
  const REPEATS = CARDS.length - unique(CARDS).length;
  const REPEATS_NOTE = words(REPEATS) + ' ' + plural(REPEATS, 'встречается', 'встречаются', 'встречаются') + ' в нескольких темах — прогресс у них общий.';

  const MODES = {
    random: {
      type: 'cards', tag: 'Zufall',
      name: () => 'Случайные ' + size(),
      text: () => words(size()) + ' наугад из отмеченных тем.',
      pick: (p) => shuffle(unique(p)).slice(0, size()),
      again: () => 'Ещё ' + size() + ' случайных'
    },
    fresh: {
      type: 'cards', tag: 'Neu',
      name: () => 'Новые слова',
      text: () => 'Слова, которые ещё не встречались. По порядку списка.',
      empty: 'Новых слов не осталось — все уже встречались.',
      pick: (p) => unique(p).filter((c) => statusOf(c) === 'new').slice(0, size()),
      count: (p) => unique(p).filter((c) => statusOf(c) === 'new').length,
      again: () => 'Следующие новые'
    },
    hard: {
      type: 'cards', tag: 'Giftschrank',
      name: () => 'Трудные слова',
      text: () => 'Слова с ошибками. Уходят отсюда после двух верных ответов подряд.',
      empty: 'Пока пусто. Сюда попадают слова, в которых была ошибка.',
      pick: (p) => hardFirst(p).slice(0, size()),
      count: (p) => hardFirst(p).length,
      again: () => 'Ещё трудные'
    },
    all: {
      type: 'cards', tag: 'Der Reihe nach',
      name: () => 'По порядку',
      text: () => 'Все слова отмеченных тем, как в списке.',
      pick: (p) => unique(p),
      count: (p) => unique(p).length,
      again: () => 'Пройти заново'
    },
    quiz: {
      type: 'quiz', tag: 'Auswahl',
      name: () => 'Тест',
      text: () => 'Четыре варианта, один верный.',
      pick: (p) => shuffle(unique(p)).slice(0, size()),
      again: () => 'Ещё тест'
    },
    write: {
      type: 'write', tag: 'Schreiben',
      name: () => 'Письмо',
      text: () => 'Видишь перевод — пишешь по-немецки.',
      pick: (p) => shuffle(unique(p)).slice(0, size()),
      again: () => 'Ещё письмо'
    },
    art: {
      type: 'art', tag: 'Der · die · das',
      name: () => 'Артикли',
      text: () => 'Род существительного: der, die или das.',
      empty: 'В отмеченных темах нет существительных с артиклем.',
      pick: (p) => {
        /* сначала те, где была ошибка, потом новые, потом остальные */
        const score = (c) => ((rec(c) && rec(c).a) || 0);
        return shuffle(unique(p).filter((c) => c.art)).sort((a, b) => score(a) - score(b)).slice(0, size());
      },
      again: () => 'Ещё артикли'
    },
    pairs: {
      type: 'pairs', tag: 'Paare',
      name: () => 'Пары',
      text: () => 'Соедини слова с переводами на время.',
      pick: (p) => shuffle(unique(p)).slice(0, size()),
      again: () => 'Ещё пары'
    }
  };
  function hardFirst(p) {
    const order = { ven: 0, sep: 1 };
    return unique(p)
      .filter((c) => statusOf(c) === 'ven' || statusOf(c) === 'sep')
      .sort((a, b) => order[statusOf(a)] - order[statusOf(b)] || (rec(a).t || 0) - (rec(b).t || 0));
  }
  const TYPE_NAME = { cards: 'Карточки', quiz: 'Тест', write: 'Письмо', pairs: 'Пары', art: 'Артикли' };

  /* ---------- Озвучка ---------- */
  const canSpeak = 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  let voice = null;
  function findVoice() {
    try {
      const all = window.speechSynthesis.getVoices();
      voice = all.find((v) => /^de[-_]DE/i.test(v.lang)) || all.find((v) => /^de/i.test(v.lang)) || null;
    } catch (e) { voice = null; }
  }
  if (canSpeak) {
    findVoice();
    try { window.speechSynthesis.addEventListener('voiceschanged', findVoice); } catch (e) { /* старый Safari */ }
  }
  function say(text) {
    if (!canSpeak || !text) return;
    try {
      window.speechSynthesis.cancel();
      const u = new window.SpeechSynthesisUtterance(String(text).replace(/[()]/g, ''));
      u.lang = 'de-DE';
      if (voice) u.voice = voice;
      u.rate = 0.88;
      window.speechSynthesis.speak(u);
    } catch (e) { /* молча */ }
  }

  /* ---------- Проверка написанного ---------- */
  const normAns = (s) => String(s).normalize('NFC').toLowerCase()
    .replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/[.,;:!?()„“”"'’`´\-–—/+…]/g, ' ')
    .replace(/\s+/g, ' ').trim();
  const tidy = (s) => String(s).normalize('NFC').replace(/\s+/g, ' ').trim();
  const stripArticle = (s) => s.replace(/^(der|die|das|ein|eine|einen|den) /, '');

  /* Все написания, которые считаем верными для карточки */
  function spellings(card) {
    const out = [];
    const add = (s) => {
      s = tidy(s);
      if (/\(.*?\)/.test(s)) {
        add(s.replace(/[()]/g, ''));
        add(s.replace(/\(.*?\)\s*/g, ''));
        return;
      }
      if (s && !out.includes(s)) out.push(s);
    };
    add(card.de);
    if (card.de.includes(',')) card.de.split(',').forEach(add);
    card.extra.forEach(add);
    return out;
  }
  function distance(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const row = [i];
      for (let j = 1; j <= b.length; j++) {
        row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = row;
    }
    return prev[b.length];
  }
  function judge(card, typed) {
    const raw = tidy(typed);
    const input = normAns(typed);
    /* у «лекарство» два слова — die Arznei и das Medikament; годится любое */
    const twins = [card].concat(CARDS.filter((c) => c !== card && c.ruKey === card.ruKey));
    for (const c of twins) {
      const list = spellings(c);
      if (list.includes(raw)) return { ok: true, card: c, kind: 'exact' };
      if (list.some((s) => s.toLowerCase() === raw.toLowerCase())) return { ok: true, card: c, kind: 'case' };
      if (list.some((s) => normAns(s) === input)) return { ok: true, card: c, kind: 'umlaut' };
    }
    for (const c of twins) {
      const hit = spellings(c).some((s) => {
        const n = normAns(s);
        return stripArticle(n) !== n && stripArticle(n) === input;
      });
      if (hit) return { ok: true, card: c, kind: 'noart' };
    }
    const near = spellings(card).some((s) => {
      const n = normAns(s);
      return n.length >= 5 && distance(n, input) === 1;
    });
    return { ok: false, card: card, kind: near ? 'near' : 'wrong' };
  }

  /* ---------- Неверные варианты для теста ---------- */
  function distractors(card) {
    const mine = new Set(card.key.split(/\s+/).filter((w) => w.length > 3 && !/^(der|die|das|ein|eine|sich|sein)$/.test(w)));
    const likeness = (o) => o.key.split(/\s+/).filter((w) => mine.has(w)).length;
    const tiers = [
      CARDS.filter((o) => o.t === card.t && o.kind === card.kind),
      CARDS.filter((o) => o.kind === card.kind),
      CARDS
    ];
    const usedRu = new Set([card.ruKey]);
    const usedDe = new Set([card.key]);
    const out = [];
    for (const tier of tiers) {
      const ranked = tier
        .map((o) => ({ o: o, s: likeness(o) + Math.random() * 0.9 }))
        .sort((a, b) => b.s - a.s);
      for (const item of ranked) {
        if (out.length === 3) break;
        const o = item.o;
        if (usedRu.has(o.ruKey) || usedDe.has(o.key)) continue;
        usedRu.add(o.ruKey);
        usedDe.add(o.key);
        out.push(o);
      }
      if (out.length === 3) break;
    }
    return out;
  }

  /* ---------- Навигация ---------- */
  const view = $('#view');
  const liveEl = $('#live');
  const toastEl = $('#toast');
  const sheet = $('#settings');
  let route = 'home';
  let S = null;       // текущая тренировка
  let ticker = 0;     // таймер «Пар»
  let pending = 0;    // отложенный переход к следующему вопросу

  function parseRoute() {
    const h = (location.hash || '').replace(/^#\/?/, '');
    if (h === 'dict') return 'dict';
    if (h === 'play' && S && !S.done) return 'play';
    if (h === 'result' && S && S.log.length) return 'result';
    return 'home';
  }
  /* Адрес меняем только на настоящем сайте (или в файле с диска). В окне предпросмотра
     страница живёт без адреса — там экраны переключаются просто в памяти. */
  const useHash = /^(https?|file):$/.test(location.protocol);
  let ownHash = null;   // адрес, который мы только что выставили сами
  function go(to, replace) {
    const hash = to === 'home' ? '#/' : '#/' + to;
    const same = location.hash === hash || (to === 'home' && !location.hash);
    let pushed = false;
    route = to;
    if (!same && useHash) {
      try {
        if (replace) history.replaceState(null, '', hash);
        else {
          ownHash = hash;
          location.hash = hash;
          pushed = location.hash === hash;
          if (!pushed) ownHash = null;
        }
      } catch (e) { ownHash = null; /* в песочнице адрес менять нельзя — живём без него */ }
    }
    render(true);
    return pushed;
  }
  function goHome() {
    if (S && S.pushed) {
      S.pushed = false;
      try {
        history.back();
        /* если «назад» не сработало (так бывает в окне предпросмотра) — идём сами */
        setTimeout(() => { if (route !== 'home') go('home', true); }, 350);
        return;
      } catch (e) { /* ниже */ }
    }
    go('home', true);
  }
  window.addEventListener('hashchange', () => {
    if (ownHash !== null && location.hash === ownHash) { ownHash = null; return; }
    ownHash = null;
    route = parseRoute();
    render(true);
  });

  function stopClocks() {
    clearInterval(ticker);
    clearTimeout(pending);
    ticker = 0;
    pending = 0;
  }
  /* Кто сейчас управляет: клавиатура или палец/мышь. От этого зависит, куда ставить фокус */
  let byKeys = false;
  document.addEventListener('keydown', (e) => { if (!e.metaKey && !e.ctrlKey && !e.altKey) byKeys = true; }, true);
  document.addEventListener('pointerdown', () => { byKeys = false; }, true);

  function render(fresh) {
    stopClocks();
    document.body.dataset.route = route;
    view.classList.toggle('is-fresh', !!fresh);
    const dictLink = $('[data-nav="dict"]');
    if (dictLink) {
      if (route === 'dict') dictLink.setAttribute('aria-current', 'page'); else dictLink.removeAttribute('aria-current');
    }
    if (route === 'play') viewPlay();
    else if (route === 'result') viewResult();
    else if (route === 'dict') viewDict();
    else viewHome();
    if (fresh) {
      window.scrollTo(0, 0);
      if (byKeys && route !== 'play') view.focus({ preventScroll: true });
    }
  }

  let toastTimer = 0;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('is-on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-on'), 2800);
  }
  const announce = (text) => { liveEl.textContent = text; };

  /* ---------- Главная ---------- */
  function viewHome() {
    const all = tally(unique(CARDS));
    const p = pool();
    const none = !p.length;
    const today = store.days[dayKey()] || 0;
    const run = streak();

    const day = today
      ? 'Сегодня — <b>' + today + '</b> ' + plural(today, 'ответ', 'ответа', 'ответов') + (run > 1 ? ' · <b>' + run + '</b> ' + plural(run, 'день', 'дня', 'дней') + ' подряд' : '')
      : (run > 0 ? 'Сегодня пока ни одного ответа. Серия — <b>' + run + '</b> ' + plural(run, 'день', 'дня', 'дней') + ', не обрывай.' : 'Сегодня пока ни одного ответа.');

    const topics = TOPICS.map((t) => {
      const cards = CARDS.filter((c) => c.topic === t);
      const k = tally(cards);
      const on = isOn(t);
      return '<button class="topic" type="button" data-act="topic" data-id="' + esc(t.id) + '" aria-pressed="' + on + '">' +
        '<span class="topic__box">' + ICON.tick + '</span>' +
        '<span class="topic__tag eyebrow" lang="de">' + esc(t.tag || '') + '</span>' +
        '<span class="topic__count" aria-label="выучено ' + k.ok + ' из ' + k.all + '">' + k.ok + ' / ' + k.all + '</span>' +
        '<span class="topic__name" lang="de" title="' + esc(t.ru || '') + '">' + esc(t.de) + '</span>' +
        '<span class="topic__bar" aria-hidden="true"><i style="width:' + (k.all ? (k.ok / k.all * 100).toFixed(1) : 0) + '%"></i></span>' +
        '</button>';
    }).join('');

    const tile = (id, main) => {
      const m = MODES[id];
      const count = m.count ? m.count(p) : (id === 'art' ? unique(p).filter((c) => c.art).length : null);
      const dead = none || (m.empty && count === 0);
      const text = !none && m.empty && count === 0 ? m.empty : m.text();
      let badge = '';
      if (!main && m.count && !dead) {
        badge = '<span class="tile__badge badge ' + (id === 'hard' ? 'badge--ven' : id === 'fresh' ? '' : 'badge--plain') + '" aria-label="' + words(count) + '">' + count + '</span>';
      }
      return '<button class="tile' + (main ? ' tile--main label' : '') + '" type="button" data-act="start" data-mode="' + id + '"' + (dead ? ' disabled' : '') + '>' +
        '<span class="tile__tag eyebrow" lang="de">' + m.tag + '</span>' + badge +
        '<span class="tile__name">' + m.name() + '</span>' +
        '<span class="tile__text">' + text + '</span>' +
        (main ? '<span class="tile__go">Начать ' + ICON.arrow + '</span>' : '') +
        '</button>';
    };

    const statBlock =
      '<section class="stat" aria-labelledby="h-stat">' +
        '<h1 class="eyebrow" id="h-stat">Выучено</h1>' +
        '<p class="stat__num">' + all.ok + '<span>из ' + all.all + '</span></p>' +
        '<div class="stat__bar" role="img" aria-label="Знаю ' + all.ok + ', учу ' + all.sep + ', трудных ' + all.ven + ', новых ' + all.new + '">' +
          (all.ok ? '<i class="s-ok" style="flex:' + all.ok + '"></i>' : '') +
          (all.sep ? '<i class="s-sep" style="flex:' + all.sep + '"></i>' : '') +
          (all.ven ? '<i class="s-ven" style="flex:' + all.ven + '"></i>' : '') +
          '<i class="s-new" style="flex:' + all.new + '"></i>' +
        '</div>' +
        '<ul class="legend">' +
          ['ok', 'sep', 'ven', 'new'].map((st) => '<li>' + mark(st) + STATUS_MANY[st] + ' <b>' + all[st] + '</b></li>').join('') +
        '</ul>' +
        '<p class="stat__day">' + day + '</p>' +
      '</section>';
    const topicsBlock =
      '<section aria-labelledby="h-topics">' +
        '<h2 class="rubric" id="h-topics">Темы</h2>' +
        '<div class="topics">' + topics + '</div>' +
        '<p class="hint' + (none ? ' hint--warn' : '') + '">' + (none ? 'Отметь хотя бы одну тему — режимам нужны слова.' : 'Режимы берут слова из отмеченных тем.') + '</p>' +
      '</section>';
    const cardsBlock =
      '<section aria-labelledby="h-cards">' +
        '<h2 class="rubric" id="h-cards">Карточки</h2>' +
        '<div class="tiles tiles--cards">' + tile('random', true) + tile('fresh') + tile('hard') + tile('all') + '</div>' +
      '</section>';
    const drillsBlock =
      '<section aria-labelledby="h-drills">' +
        '<h2 class="rubric" id="h-drills">Упражнения</h2>' +
        '<div class="tiles tiles--drills">' + tile('quiz') + tile('write') + tile('art') + tile('pairs') + '</div>' +
      '</section>';
    const dictBlock =
      '<a class="tolist" href="#/dict">' +
        '<span class="tolist__name">Словарь</span>' +
        '<span class="tolist__text">Все слова по темам: поиск, озвучка, ярлыки.</span>' +
        ICON.arrow +
      '</a>';
    const rulesBlock =
      '<section class="rules" aria-labelledby="h-rules">' +
        '<h2 class="rubric" id="h-rules">Ярлыки <small>как на штангласах</small></h2>' +
        '<ul class="rules__list">' +
          '<li><span class="swatch" lang="de" aria-hidden="true">das Wort</span><span><b>Знаю.</b> Чёрным по белому: ответ был верным.</span></li>' +
          '<li><span class="swatch swatch--ven" lang="de" aria-hidden="true">das Wort</span><span><b>Трудное.</b> Белым по чёрному: была ошибка. Слово ждёт в «Трудных».</span></li>' +
          '<li><span class="swatch swatch--sep" lang="de" aria-hidden="true">das Wort</span><span><b>Учу.</b> Красным по белому: после ошибки один верный ответ. Ещё один — и слово выучено.</span></li>' +
        '</ul>' +
        (persistent ? '' : '<p class="note-storage">В этом окне браузер не даёт сохранять данные — прогресс пропадёт, когда закроешь страницу.</p>') +
      '</section>';

    /* Порядок в разметке — такой же, как на экране. На телефоне режимы идут сразу за счётом,
       на широком экране счёт и темы стоят слева, режимы справа. */
    view.innerHTML = wide.matches
      ? '<div class="home home--wide wrap">' +
          '<div class="home__side">' + statBlock + topicsBlock + '</div>' +
          '<div class="home__main">' + cardsBlock + drillsBlock + dictBlock + rulesBlock + '</div>' +
        '</div>'
      : '<div class="home wrap">' + statBlock + cardsBlock + drillsBlock + topicsBlock + dictBlock + rulesBlock + '</div>';
  }

  function toggleTopic(el) {
    const id = el.dataset.id;
    const off = store.set.off;
    const i = off.indexOf(id);
    if (i >= 0) off.splice(i, 1); else off.push(id);
    save();
    render(false);
    const again = $('.topic[data-id="' + id + '"]');
    if (again) again.focus({ preventScroll: true });
  }

  /* ---------- Тренировка: общее ---------- */
  function dirFor(type) {
    if (type === 'write') return 'ru';
    if (store.set.dir === 'mix') return Math.random() < 0.5 ? 'de' : 'ru';
    return store.set.dir;
  }
  function begin(opts) {
    const cards = opts.cards;
    if (!cards.length) return;
    const prev = S;
    S = {
      mode: opts.mode || null,
      type: opts.type,
      title: opts.title,
      cards: cards,
      dirs: cards.map(() => dirFor(opts.type)),
      i: 0,
      log: [],
      done: false,
      busy: false,
      pushed: false,
      miss: 0,
      t0: Date.now()
    };
    if (S.type === 'pairs') {
      S.rounds = makeRounds(cards);
      S.cards = S.rounds.reduce((a, r) => a.concat(r), []);
      S.r = 0;
    }
    if (route === 'home' || route === 'dict') S.pushed = go('play', false);
    else {
      S.pushed = !!(prev && prev.pushed);
      go('play', true);
    }
  }
  function startMode(id) {
    const m = MODES[id];
    if (!m) return;
    begin({ mode: id, type: m.type, title: m.name(), cards: m.pick(pool()) });
  }

  function viewPlay() {
    if (!S) { go('home', true); return; }
    const total = S.cards.length;
    view.innerHTML =
      '<section class="play play--' + S.type + '">' +
        '<header class="playbar">' +
          '<button class="iconbtn" type="button" data-act="exit" aria-label="Закончить">' + ICON.close + '</button>' +
          '<h1 class="playbar__title">' + esc(S.title) + '</h1>' +
          '<div class="playbar__right">' +
            (S.type === 'cards' ? '<button class="iconbtn" type="button" id="undo" data-act="undo" aria-label="Вернуть прошлую карточку" disabled>' + ICON.undo + '</button>' : '') +
            '<p class="playbar__count" id="count"></p>' +
          '</div>' +
        '</header>' +
        '<div class="meter" id="meterbox" role="progressbar" aria-label="Пройдено" aria-valuemin="0" aria-valuemax="' + total + '" aria-valuenow="0"><i id="meter"></i></div>' +
        '<div class="play__body" id="body" tabindex="-1"></div>' +
      '</section>';
    if (S.type === 'pairs') {
      ticker = setInterval(paintMeter, 500);
    }
    step();
  }
  function paintMeter() {
    const total = S.cards.length;
    const count = $('#count');
    const bar = $('#meter');
    if (!count || !bar) return;
    if (S.type === 'pairs') {
      count.textContent = clock(Math.floor((Date.now() - S.t0) / 1000));
      count.setAttribute('aria-label', 'Время');
    } else {
      count.innerHTML = Math.min(S.i + 1, total) + ' <span>/ ' + total + '</span>';
    }
    bar.style.width = (S.i / total * 100) + '%';
    $('#meterbox').setAttribute('aria-valuenow', S.i);
    const undo = $('#undo');
    if (undo) undo.disabled = !S.log.length;
  }
  function step() {
    clearTimeout(pending);
    pending = 0;
    S.busy = false;
    paintMeter();
    if (S.type === 'cards') stepCards();
    else if (S.type === 'quiz') stepQuiz();
    else if (S.type === 'write') stepWrite();
    else if (S.type === 'art') stepArt();
    else stepPairs();
    fitAll(view);
    const body = $('#body');
    if (byKeys && body && !body.contains(document.activeElement)) body.focus({ preventScroll: true });
  }
  function next() {
    clearTimeout(pending);
    pending = 0;
    S.i++;
    if (S.i >= S.cards.length) finish(); else step();
  }
  function finish() {
    stopClocks();
    S.done = true;
    if (S.type === 'pairs') {
      S.time = Math.max(1, Math.round((Date.now() - S.t0) / 1000));
      if (S.mode === 'pairs' && !S.aborted) {
        const k = 'pairs:' + S.cards.length;
        S.bestBefore = store.best[k] || 0;
        if (!S.bestBefore || S.time < S.bestBefore) {
          store.best[k] = S.time;
          save();
        }
      }
    }
    go('result', true);
  }
  function exitPlay() {
    stopClocks();
    if (S && S.log.length) {
      S.aborted = S.i < S.cards.length;
      finish();
    } else goHome();
  }

  /* ---------- Ярлык: кусочки разметки ---------- */
  function labelHead(card, tool) {
    return '<div class="label__head">' +
      '<span class="label__no">№ ' + esc(card.n) + '</span>' +
      '<span class="label__topic" lang="de">' + esc(card.topic.kurz || card.topic.de) + '</span>' +
      '<span class="label__tool">' + (tool || '') + '</span>' +
      '</div>';
  }
  const noteHtml = (note) => note.split(' · ').map((part) => '<span style="white-space:nowrap">' + esc(part) + '</span>').join(' · ');
  const ruHtml = (ru) => esc(ru).replace(/;\s*(\d\))/g, ';<br>$1');
  function sayBtn(card, cls) {
    if (!canSpeak) return '';
    return '<button class="speak ' + (cls || '') + '" type="button" data-act="say" data-text="' + esc(card.de) + '" aria-label="Послушать слово">' + ICON.speak + '</button>';
  }

  /* Сторона карточки: lang — что крупно; isBack — показывать ли остальное */
  function face(card, lang, isBack, st) {
    let mid;
    if (lang === 'de') {
      mid = '<p class="label__word" lang="de" data-fit>' + esc(card.de) + '</p>' +
        (isBack && card.note ? '<p class="label__note" lang="de">' + noteHtml(card.note) + '</p>' : '') +
        (isBack ? '<p class="label__also" lang="ru">' + ruHtml(card.ru) + '</p>' : '');
    } else {
      mid = '<p class="label__word" lang="ru" data-fit>' + ruHtml(card.ru) + '</p>' +
        (isBack ? '<p class="label__also" lang="de">' + esc(card.de) + (card.note ? ' <span class="label__note">' + noteHtml(card.note) + '</span>' : '') + '</p>' : '');
    }
    return '<div class="label" data-class="' + paperOf(st) + '"><div class="label__in">' +
      labelHead(card) +
      '<div class="label__mid">' + mid + '</div>' +
      '<div class="label__foot"><span>' + STATUS[st] + '</span>' + (isBack ? '' : '<span>перевернуть</span>') + '</div>' +
      '</div></div>';
  }

  /* Крупный текст сам подбирает кегль, чтобы длинное слово влезло в ярлык */
  function fit(el) {
    const box = el.closest('.label__mid');
    if (!box || !box.clientWidth) return;
    const ru = el.lang === 'ru';
    const min = ru ? 14 : 16;
    let px = Math.min(ru ? 42 : 64, Math.round(box.clientWidth * (ru ? 0.118 : 0.15)));
    el.style.overflowWrap = 'normal';
    el.style.fontSize = px + 'px';
    let guard = 70;
    while (guard-- > 0 && px > min && (el.scrollWidth > el.clientWidth + 1 || box.scrollHeight > box.clientHeight + 1)) {
      px -= px > 30 ? 2 : 1;
      el.style.fontSize = px + 'px';
    }
    if (el.scrollWidth > el.clientWidth + 1) el.style.overflowWrap = 'anywhere';
  }
  const fitAll = (root) => $$('[data-fit]', root).forEach(fit);

  /* ---------- Карточки ---------- */
  function stepCards() {
    const card = S.cards[S.i];
    const dir = S.dirs[S.i];
    const st = statusOf(card);
    const back = dir === 'de' ? 'ru' : 'de';
    S.flipped = false;
    S.seen = false;
    $('#body').innerHTML =
      '<div class="stage">' +
        '<div class="deck" data-rest="' + Math.min(2, S.cards.length - S.i - 1) + '">' +
          '<i class="deck__ghost"></i><i class="deck__ghost"></i>' +
          '<div class="card is-enter" id="card" data-act="flip" data-class="' + paperOf(st) + '">' +
            '<div class="card__flip">' +
              '<div class="card__face card__face--front">' + face(card, dir, false, st) + '</div>' +
              '<div class="card__face card__face--back" aria-hidden="true">' + face(card, back, true, st) + '</div>' +
            '</div>' +
            '<span class="stamp stamp--yes" aria-hidden="true">Знаю</span>' +
            '<span class="stamp stamp--no" aria-hidden="true">Не знаю</span>' +
            (canSpeak ? '<button class="speak card__speak" type="button" id="cardspeak" data-act="say" data-text="' + esc(card.de) + '" aria-label="Послушать слово"' + (dir === 'ru' ? ' hidden' : '') + '>' + ICON.speak + '</button>' : '') +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="actions"></div>' +
      '<p class="keys" id="keys"></p>';
    paintCardActions();
    bindDrag($('#card'));
    if (store.set.speak && dir === 'de') say(card.de);
  }
  function paintCardActions() {
    const box = $('#actions');
    const keys = $('#keys');
    if (!box) return;
    if (S.seen) {
      box.className = 'actions actions--two';
      box.innerHTML =
        '<button class="btn btn--black" type="button" data-act="no">Не знаю</button>' +
        '<button class="btn" type="button" data-act="yes">Знаю</button>';
      keys.innerHTML = '<span><kbd>←</kbd>не знаю</span><span><kbd>→</kbd>знаю</span><span><kbd>пробел</kbd>перевернуть</span>';
    } else {
      box.className = 'actions';
      box.innerHTML = '<button class="btn btn--wide" type="button" data-act="flip">Перевернуть</button>';
      keys.innerHTML = '<span><kbd>пробел</kbd>перевернуть</span>';
    }
  }
  function flip() {
    if (!S || S.type !== 'cards' || S.busy) return;
    const el = $('#card');
    if (!el) return;
    const card = S.cards[S.i];
    const dir = S.dirs[S.i];
    S.flipped = !S.flipped;
    el.classList.toggle('is-flipped', S.flipped);
    $('.card__face--front', el).setAttribute('aria-hidden', S.flipped);
    $('.card__face--back', el).setAttribute('aria-hidden', !S.flipped);
    if (!S.seen) {
      S.seen = true;
      paintCardActions();
      const sp = $('#cardspeak');
      if (sp) sp.hidden = false;
      if (store.set.speak && dir === 'ru') say(card.de);
    }
    announce((dir === 'de') === S.flipped ? card.ru : card.de);
  }
  function fly(el, side) {
    if (!el || calm.matches || !el.animate) return Promise.resolve();
    const from = getComputedStyle(el).transform;
    try {
      return el.animate(
        [
          { transform: from && from !== 'none' ? from : 'translateX(0) rotate(0deg)', opacity: 1 },
          { transform: 'translateX(' + side * 125 + '%) rotate(' + side * 13 + 'deg)', opacity: 0 }
        ],
        { duration: 280, easing: 'cubic-bezier(.5, 0, .8, .45)', fill: 'forwards' }
      ).finished.catch(() => {});
    } catch (e) { return Promise.resolve(); }
  }
  function answerCard(ok) {
    if (!S || S.type !== 'cards' || S.busy) return;
    if (!S.seen) { flip(); return; }
    S.busy = true;
    const card = S.cards[S.i];
    const before = grade(card, ok);
    S.log.push({ card: card, ok: ok, before: before });
    const el = $('#card');
    /* перед тем как улететь, карточка на миг показывает новый ярлык */
    const paper = paperOf(statusOf(card));
    if (el) {
      el.dataset.class = paper;
      $$('.label', el).forEach((l) => { l.dataset.class = paper; });
      el.style.setProperty('--yes', ok ? 1 : 0);
      el.style.setProperty('--no', ok ? 0 : 1);
    }
    const session = S;
    const wait = calm.matches ? 0 : 130;
    setTimeout(() => {
      fly(el, ok ? 1 : -1).then(() => {
        if (S !== session || route !== 'play') return;
        next();
      });
    }, wait);
  }
  function undoCard() {
    if (!S || S.type !== 'cards' || S.busy || !S.log.length) return;
    const last = S.log.pop();
    ungrade(last.card, last.before);
    S.i = Math.max(0, S.i - 1);
    step();
  }
  function bindDrag(el) {
    let x0 = 0, y0 = 0, dx = 0, id = null, on = false, moved = false, dragged = false;
    const place = (v) => {
      el.style.transform = v ? 'translateX(' + v + 'px) rotate(' + (v / 26) + 'deg)' : '';
      const p = Math.min(1, Math.abs(v) / 84);
      el.style.setProperty('--yes', v > 0 ? p : 0);
      el.style.setProperty('--no', v < 0 ? p : 0);
    };
    el.addEventListener('pointerdown', (e) => {
      dragged = false;
      if (e.button || S.busy || e.target.closest('.speak')) return;
      id = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; on = true; moved = false;
      el.classList.remove('is-back', 'is-enter');
    });
    el.addEventListener('pointermove', (e) => {
      if (!on || e.pointerId !== id) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!moved) {
        if (Math.abs(mx) < 8 || Math.abs(mx) < Math.abs(my)) return;
        moved = true;
        try { el.setPointerCapture(id); } catch (err) { /* не страшно */ }
      }
      dx = S.seen ? mx : mx * 0.16;   // пока не перевернул — карточка упирается
      place(dx);
    });
    const end = (e) => {
      if (!on || e.pointerId !== id) return;
      on = false;
      if (!moved) return;
      dragged = true;
      if (S.seen && Math.abs(dx) > 84) answerCard(dx > 0);
      else {
        el.classList.add('is-back');
        place(0);
      }
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    /* щелчок, которым заканчивается перетаскивание мышью, — не «перевернуть» */
    el.addEventListener('click', (e) => {
      if (dragged) { dragged = false; e.stopPropagation(); }
    }, true);
  }

  /* ---------- Вопрос-ярлык для упражнений ---------- */
  function promptLabel(card, mid, foot, tool) {
    return '<div class="prompt label is-enter" id="prompt" data-class="' + paperOf(statusOf(card)) + '"><div class="label__in">' +
      labelHead(card, tool) +
      '<div class="label__mid" id="mid">' + mid + '</div>' +
      '<div class="label__foot"><span>' + foot + '</span></div>' +
      '</div></div>';
  }
  const nextBtn = () => '<button class="btn btn--wide" type="button" id="next" data-act="next">Дальше</button>';

  /* ---------- Тест ---------- */
  function stepQuiz() {
    const card = S.cards[S.i];
    const dir = S.dirs[S.i];
    const opts = shuffle([card].concat(distractors(card)));
    S.q = { opts: opts, done: false };
    const mid = dir === 'de'
      ? '<p class="label__word" lang="de" data-fit>' + esc(card.de) + '</p>'
      : '<p class="label__word" lang="ru" data-fit>' + ruHtml(card.ru) + '</p>';
    $('#body').innerHTML =
      promptLabel(card, mid, dir === 'de' ? 'Выбери перевод' : 'Выбери слово', dir === 'de' ? sayBtn(card) : '') +
      '<div class="play__work">' +
        '<div class="options" role="group" aria-label="Варианты ответа">' +
          opts.map((o, i) =>
            '<button class="option" type="button" data-act="pick" data-i="' + i + '" lang="' + (dir === 'de' ? 'ru' : 'de') + '">' +
              '<span class="option__nr" aria-hidden="true">' + (i + 1) + '</span>' +
              '<span class="option__text">' + esc(dir === 'de' ? o.ru : o.de) + '</span>' +
              '<svg class="option__icon" viewBox="0 0 24 24" aria-hidden="true"></svg>' +
            '</button>').join('') +
        '</div>' +
        '<div class="actions" id="actions"></div>' +
      '</div>' +
      '<p class="keys"><span><kbd>1</kbd>–<kbd style="margin-left:6px">' + opts.length + '</kbd>выбрать</span><span><kbd>Enter</kbd>дальше</span></p>';
    if (store.set.speak && dir === 'de') say(card.de);
  }
  function pickOption(i) {
    if (!S || S.type !== 'quiz' || !S.q || S.q.done) return;
    const card = S.cards[S.i];
    const dir = S.dirs[S.i];
    const chosen = S.q.opts[i];
    if (!chosen) return;
    const ok = chosen === card;
    S.q.done = true;
    grade(card, ok);
    S.log.push({ card: card, ok: ok });
    $$('.option').forEach((btn, k) => {
      const o = S.q.opts[k];
      btn.disabled = true;
      const icon = $('.option__icon', btn);
      if (o === card) {
        btn.classList.add('is-right');
        icon.innerHTML = '<path d="M5 12.5l4.5 4.5L19 7.5"/>';
      } else if (k === i) {
        btn.classList.add('is-wrong');
        icon.innerHTML = '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>';
      } else btn.classList.add('is-dim');
    });
    announce(ok ? 'Верно' : 'Неверно. Правильно: ' + (dir === 'de' ? card.ru : card.de));
    if (store.set.speak && dir === 'ru') say(card.de);
    if (ok) pending = setTimeout(next, calm.matches ? 500 : 800);
    else {
      $('#actions').innerHTML = nextBtn();
      $('#next').focus({ preventScroll: true });
    }
  }

  /* ---------- Письмо ---------- */
  function stepWrite() {
    const card = S.cards[S.i];
    S.q = { done: false, caps: false };
    $('#body').innerHTML =
      promptLabel(card, '<p class="label__word" lang="ru" data-fit>' + ruHtml(card.ru) + '</p>', 'Напиши по-немецки', '') +
      '<div class="play__work">' +
        '<form class="write" id="write" novalidate autocomplete="off">' +
          '<div class="write__field">' +
            '<input class="write__input" id="answer" type="text" lang="de" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="по-немецки" aria-label="Слово по-немецки">' +
          '</div>' +
          '<div class="umlauts" id="umlauts" role="group" aria-label="Немецкие буквы">' + umlautKeys(false) + '</div>' +
          '<div id="verdict" aria-live="polite"></div>' +
          '<div class="actions actions--two" id="actions">' +
            '<button class="btn btn--ghost" type="button" data-act="giveup">Не знаю</button>' +
            '<button class="btn" type="submit">Проверить</button>' +
          '</div>' +
        '</form>' +
      '</div>';
    const input = $('#answer');
    /* на телефоне клавиатура закрыла бы вопрос, поэтому сами в поле не прыгаем */
    if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) input.focus({ preventScroll: true });
  }
  function umlautKeys(caps) {
    const list = caps ? ['Ä', 'Ö', 'Ü', 'ß'] : ['ä', 'ö', 'ü', 'ß'];
    return '<button class="umlaut" type="button" data-act="caps" aria-pressed="' + caps + '" aria-label="Заглавные буквы" style="font-family:var(--sans);font-size:17px">' + (caps ? 'ab' : 'AB') + '</button>' +
      list.map((ch) => '<button class="umlaut" type="button" data-act="umlaut" data-ch="' + ch + '" lang="de">' + ch + '</button>').join('');
  }
  function typeChar(ch) {
    const input = $('#answer');
    if (!input || input.readOnly) return;
    const a = input.selectionStart == null ? input.value.length : input.selectionStart;
    const b = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    input.value = input.value.slice(0, a) + ch + input.value.slice(b);
    input.focus({ preventScroll: true });
    try { input.setSelectionRange(a + ch.length, a + ch.length); } catch (e) { /* не страшно */ }
  }
  function checkWritten(gaveUp) {
    if (!S || S.type !== 'write' || !S.q) return;
    if (S.q.done) { next(); return; }
    const card = S.cards[S.i];
    const input = $('#answer');
    const typed = input.value;
    if (!gaveUp && !typed.trim()) { input.focus({ preventScroll: true }); return; }
    const res = gaveUp ? { ok: false, card: card, kind: 'gaveup' } : judge(card, typed);
    S.q.done = true;
    grade(card, res.ok);
    S.log.push({ card: card, ok: res.ok, typed: gaveUp ? '' : tidy(typed) });
    input.readOnly = true;
    input.placeholder = '';
    /* «Не знаю» с пустым полем: зачёркивать нечего, поле убираем */
    if (!typed.trim()) input.parentNode.hidden = true;
    $('#write').classList.add(res.ok ? 'is-right' : 'is-wrong');
    $('#umlauts').hidden = true;

    const shown = res.card;
    let more = '';
    if (res.kind === 'case') more = 'Не забудь про большие буквы.';
    else if (res.kind === 'umlaut') more = 'С умлаутом и ß пишется так.';
    else if (res.kind === 'noart') more = 'Не забудь артикль.';
    else if (res.kind === 'near') more = 'Почти — отличается одна буква.';
    if (res.ok && shown !== card) more = 'В списке есть и ' + esc(card.de) + '.';
    const say1 = res.ok ? ICON.check + 'Верно' : ICON.cross + (res.kind === 'gaveup' ? 'Запомни' : 'Правильно так');
    $('#verdict').innerHTML =
      '<div class="verdict verdict--' + (res.ok ? 'right' : 'wrong') + '">' +
        '<p class="verdict__say">' + say1 + '</p>' +
        '<p class="verdict__word" lang="de">' + esc(shown.de) + '</p>' +
        ((shown.note || more) ? '<p class="verdict__more">' + (shown.note ? '<i lang="de">' + noteHtml(shown.note) + '</i>' : '') + (shown.note && more ? ' · ' : '') + more + '</p>' : '') +
      '</div>';
    $('#actions').className = 'actions';
    $('#actions').innerHTML = nextBtn();
    $('#next').focus({ preventScroll: true });
    if (store.set.speak) say(shown.de);
  }

  /* ---------- Артикли ---------- */
  function stepArt() {
    const card = S.cards[S.i];
    S.q = { done: false };
    $('#body').innerHTML =
      promptLabel(card, '<p class="label__word" lang="de" data-fit>' + esc(card.bare) + '</p>', 'Какой артикль?', '') +
      '<div class="play__work">' +
        '<div class="articles" role="group" aria-label="Артикль">' +
          ['der', 'die', 'das'].map((a, i) =>
            '<button class="btn" type="button" data-act="article" data-a="' + a + '" lang="de"><small aria-hidden="true">' + (i + 1) + '</small>' + a + '</button>').join('') +
        '</div>' +
        '<div class="actions" id="actions"></div>' +
      '</div>' +
      '<p class="keys"><span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd>выбрать</span><span><kbd>Enter</kbd>дальше</span></p>';
  }
  function pickArticle(a) {
    if (!S || S.type !== 'art' || !S.q || S.q.done) return;
    const card = S.cards[S.i];
    const ok = a === card.art;
    S.q.done = true;
    gradeArticle(card, ok);
    S.log.push({ card: card, ok: ok, typed: ok ? '' : a + ' ' + card.bare });
    $$('.articles .btn').forEach((btn) => {
      btn.disabled = true;
      if (btn.dataset.a === card.art) btn.classList.add('is-right');
      else if (btn.dataset.a === a) btn.classList.add('is-wrong');
      else btn.classList.add('is-dim');
    });
    $('#mid').innerHTML =
      '<p class="label__word" lang="de" data-fit>' + esc(card.de) + '</p>' +
      (card.note ? '<p class="label__note" lang="de">' + noteHtml(card.note) + '</p>' : '') +
      '<p class="label__also" lang="ru">' + ruHtml(card.ru) + '</p>';
    $('#prompt .label__foot span').textContent = ok ? 'Верно' : 'Правильно — ' + card.art;
    fitAll($('#prompt'));
    announce((ok ? 'Верно. ' : 'Неверно. ') + card.de + ' — ' + card.ru);
    if (store.set.speak) say(card.de);
    if (ok) pending = setTimeout(next, calm.matches ? 600 : 1000);
    else {
      $('#actions').innerHTML = nextBtn();
      $('#next').focus({ preventScroll: true });
    }
  }

  /* ---------- Пары ---------- */
  function makeRounds(cards) {
    const rounds = [];
    let rest = cards.slice();
    while (rest.length) {
      const round = [];
      const ru = new Set();
      const later = [];
      rest.forEach((c) => {
        if (round.length < 5 && !ru.has(c.ruKey)) { round.push(c); ru.add(c.ruKey); } else later.push(c);
      });
      rounds.push(round);
      rest = later;
    }
    /* одинокая пара в последнем круге — не игра */
    if (rounds.length > 1 && rounds[rounds.length - 1].length < 2) rounds.pop();
    return rounds;
  }
  function stepPairs() {
    const round = S.rounds[S.r];
    const left = shuffle(round);
    const right = shuffle(round);
    S.q = { pick: null, missed: new Set(), left: round.length };
    const cell = (c, i, side) =>
      '<button class="pair" type="button" data-act="pair" data-side="' + side + '" data-id="' + esc(c.id) + '" lang="' + side + '" style="grid-column:' + (side === 'de' ? 1 : 2) + ';grid-row:' + (i + 1) + ';animation-delay:' + (i * 45 + (side === 'ru' ? 60 : 0)) + 'ms">' +
        esc(side === 'de' ? c.de : c.ru) + '</button>';
    $('#body').innerHTML =
      '<div class="pairs__info"><span>Круг <b>' + (S.r + 1) + '</b> из ' + S.rounds.length + '</span><span>Ошибок: <b id="miss">' + S.miss + '</b></span></div>' +
      '<div class="pairs" id="pairs">' + left.map((c, i) => cell(c, i, 'de')).join('') + right.map((c, i) => cell(c, i, 'ru')).join('') + '</div>';
  }
  function wobble(el) {
    if (calm.matches || !el.animate) return;
    el.animate(
      [{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }],
      { duration: 340, easing: 'ease-out' }
    );
  }
  function pickPair(el) {
    if (!S || S.type !== 'pairs' || !S.q || el.classList.contains('is-done')) return;
    const q = S.q;
    const side = el.dataset.side;
    const id = el.dataset.id;
    if (!q.pick || q.pick.side === side) {
      const same = q.pick && q.pick.el === el;
      if (q.pick) { q.pick.el.classList.remove('is-picked'); q.pick.el.setAttribute('aria-pressed', 'false'); }
      q.pick = same ? null : { side: side, id: id, el: el };
      if (!same) { el.classList.add('is-picked'); el.setAttribute('aria-pressed', 'true'); }
      return;
    }
    const first = q.pick;
    q.pick = null;
    first.el.classList.remove('is-picked');
    first.el.setAttribute('aria-pressed', 'false');
    if (first.id === id) {
      const card = byId[id];
      const ok = !q.missed.has(id);
      grade(card, ok);
      S.log.push({ card: card, ok: ok });
      S.i++;
      q.left--;
      [first.el, el].forEach((b) => {
        b.classList.add('is-flash');
        b.disabled = true;
        setTimeout(() => { b.classList.remove('is-flash'); b.classList.add('is-done'); }, 260);
      });
      paintMeter();
      announce('Пара: ' + card.de + ' — ' + card.ru);
      if (!q.left) {
        const session = S;
        pending = setTimeout(() => {
          if (S !== session) return;
          S.r++;
          if (S.r >= S.rounds.length) finish(); else step();
        }, calm.matches ? 200 : 520);
      }
    } else {
      S.miss++;
      q.missed.add(first.id);          // ошибкой считаем слово, с которого начал
      $('#miss').textContent = S.miss;
      [first.el, el].forEach((b) => {
        b.classList.add('is-wrong');
        wobble(b);
        setTimeout(() => b.classList.remove('is-wrong'), 420);
      });
      announce('Не пара');
    }
  }

  /* ---------- Итог ---------- */
  function viewResult() {
    if (!S || !S.log.length) { go('home', true); return; }
    const log = S.log;
    const total = log.length;
    const bad = [];
    log.forEach((l) => { if (!l.ok && !bad.some((b) => b.card === l.card)) bad.push(l); });
    const good = total - log.filter((l) => !l.ok).length;
    const mode = S.mode ? MODES[S.mode] : null;

    let num, say1, more = '';
    if (S.type === 'pairs') {
      num = clock(S.time);
      say1 = S.miss ? S.miss + ' ' + plural(S.miss, 'ошибка', 'ошибки', 'ошибок') : 'Без единой ошибки';
      if (S.mode === 'pairs' && !S.aborted) {
        if (!S.bestBefore) more = 'Первое время на ' + words(total) + '. Теперь есть что побить.';
        else if (S.time < S.bestBefore) more = 'Новый рекорд. Прошлый был ' + clock(S.bestBefore) + '.';
        else more = 'Рекорд на ' + words(total) + ' — ' + clock(S.bestBefore) + '.';
      }
    } else {
      num = good + '<small> / ' + total + '</small>';
      if (S.type === 'art') say1 = bad.length ? bad.length + ' ' + plural(bad.length, 'артикль', 'артикля', 'артиклей') + ' мимо' : 'Все артикли верные';
      else if (!bad.length) say1 = S.type === 'cards' ? 'Знаешь все' : 'Ни одной ошибки';
      else say1 = words(bad.length) + ' ' + plural(bad.length, 'ушло', 'ушли', 'ушло') + ' в трудные';
    }
    if (S.aborted) more = 'Пройдено ' + total + ' из ' + S.cards.length + '. ' + more;

    const d = new Date();
    const date = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();

    const canAgain = mode ? mode.pick(pool()).length > 0 : true;
    const againText = mode ? mode.again() : 'Ещё раз те же';
    const others = ['cards', 'quiz', 'write', 'pairs'].filter((t) => t !== S.type && (t !== 'pairs' || total >= 2));

    view.innerHTML =
      '<section class="result" aria-labelledby="h-result">' +
        '<div class="label slip"><div class="label__in">' +
          '<div class="label__head"><span class="label__no" lang="la" aria-hidden="true">Rp.</span><h1 class="label__topic" id="h-result">' + esc(S.title) + '</h1><span></span></div>' +
          '<div class="slip__mid">' +
            '<p class="slip__num">' + num + '</p>' +
            '<p class="slip__say">' + say1 + '</p>' +
            (more.trim() ? '<p class="slip__more">' + more.trim() + '</p>' : '') +
          '</div>' +
          '<div class="label__foot"><span lang="de">Wortapotheke</span><span>' + date + '</span></div>' +
        '</div></div>' +
        '<div class="result__actions">' +
          (bad.length ? '<button class="btn btn--wide" type="button" data-act="retry">Повторить ошибки · ' + bad.length + '</button>' : '') +
          (canAgain ? '<button class="btn btn--wide' + (bad.length ? ' btn--ghost' : '') + '" type="button" data-act="again">' + againText + '</button>' : '') +
          '<button class="btn btn--wide btn--ghost" type="button" data-act="home">На главную</button>' +
        '</div>' +
        (others.length ? '<section class="again" aria-labelledby="h-again">' +
          '<h2 class="rubric" id="h-again">Эти же слова <small>в другом режиме</small></h2>' +
          '<div class="again__row">' + others.map((t) => '<button class="btn btn--small btn--ghost" type="button" data-act="same" data-type="' + t + '">' + TYPE_NAME[t] + '</button>').join('') + '</div>' +
        '</section>' : '') +
        (bad.length ? '<section aria-labelledby="h-miss">' +
          '<h2 class="rubric" id="h-miss">Ошибки</h2>' +
          '<ul class="misses">' + bad.map((l) =>
            '<li>' + mark(statusOf(l.card)) +
              '<span class="misses__de" lang="de">' + esc(l.card.de) + (l.typed ? ' <span class="misses__you">— у тебя: ' + esc(l.typed) + '</span>' : '') + '</span>' +
              '<span class="misses__ru">' + esc(l.card.ru) + '</span>' +
            '</li>').join('') + '</ul>' +
        '</section>' : '') +
      '</section>';
  }
  function playedCards() {
    const seen = new Set();
    return S.log.map((l) => l.card).filter((c) => (seen.has(c) ? false : (seen.add(c), true)));
  }
  function retryMisses() {
    const cards = playedCards().filter((c) => S.log.some((l) => l.card === c && !l.ok));
    begin({ type: S.type === 'pairs' && cards.length < 2 ? 'cards' : S.type, title: 'Ошибки', cards: shuffle(cards) });
  }
  function playAgain() {
    if (S.mode) startMode(S.mode);
    else begin({ type: S.type, title: S.title, cards: shuffle(playedCards()) });
  }
  function sameWords(type) {
    begin({ type: type, title: TYPE_NAME[type], cards: shuffle(playedCards()) });
  }

  /* ---------- Словарь ---------- */
  const D = { q: '', filter: 'all' };
  function viewDict() {
    view.innerHTML =
      '<section class="dict" aria-labelledby="h-dict">' +
        '<h1 class="dict__title" id="h-dict">Словарь</h1>' +
        '<p class="dict__lead">Весь лексический минимум по темам. Ярлык справа показывает, как идёт слово. Нажми на него, чтобы отметить слово выученным или вернуть в новые.' + (REPEATS ? ' ' + REPEATS_NOTE : '') + '</p>' +
        '<div class="dict__tools">' +
          '<label class="search"><span class="sr">Поиск по словарю</span>' + ICON.search +
            '<input type="search" id="q" placeholder="Найти слово или перевод" autocomplete="off" autocapitalize="none" spellcheck="false" value="' + esc(D.q) + '"></label>' +
          '<div class="filters" id="filters" role="group" aria-label="Показать слова"></div>' +
        '</div>' +
        '<div id="list"></div>' +
      '</section>';
    paintFilters();
    paintList();
  }
  function paintFilters() {
    const t = tally(CARDS);
    const item = (id, name, n, icon) =>
      '<button class="filter" type="button" data-act="filter" data-f="' + id + '" aria-pressed="' + (D.filter === id) + '">' + (icon || '') + name + ' <b>' + n + '</b></button>';
    $('#filters').innerHTML =
      item('all', 'Все', t.all) +
      item('new', 'Новые', t.new, mark('new')) +
      item('ven', 'Трудные', t.ven, mark('ven')) +
      item('sep', 'Учу', t.sep, mark('sep')) +
      item('ok', 'Знаю', t.ok, mark('ok'));
  }
  const fold = (s) => normRu(s).replace(/ß/g, 'ss').replace(/ä/g, 'a').replace(/ö/g, 'o').replace(/ü/g, 'u');
  function hilite(text, q) {
    if (!q) return esc(text);
    const i = fold(text).indexOf(q);
    /* подсветка только когда длины совпадают (ß → ss сдвигает позиции) */
    if (i < 0 || fold(text).length !== text.length) return esc(text);
    return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
  }
  const markLabel = (st) => (st === 'ok' ? 'Знаю. Нажми, чтобы вернуть в новые' : STATUS[st] + '. Нажми, чтобы отметить выученным');
  function paintList() {
    const q = fold(D.q.trim());
    let shown = 0;
    const html = TOPICS.map((t) => {
      const rows = CARDS.filter((c) => c.topic === t)
        .filter((c) => D.filter === 'all' || statusOf(c) === D.filter)
        .filter((c) => !q || fold(c.de).includes(q) || fold(c.ru).includes(q));
      if (!rows.length) return '';
      shown += rows.length;
      return '<section>' +
        '<header class="dict__topic"><p class="eyebrow" lang="de">' + esc(t.tag || '') + '</p><h2 lang="de">' + esc(t.de) + '</h2><p>' + esc(t.ru || '') + ' · ' + words(rows.length) + '</p></header>' +
        '<ul>' + rows.map((c) => {
          const st = statusOf(c);
          return '<li class="row">' +
            '<span class="row__no" aria-hidden="true">' + esc(c.n) + '</span>' +
            '<div class="row__de" lang="de"><span class="row__word">' + hilite(c.de, q) + '</span>' + (c.note ? '<span class="row__note">' + noteHtml(c.note) + '</span>' : '') + '</div>' +
            '<div class="row__ru">' + hilite(c.ru, q) + '</div>' +
            '<button class="row__mark" type="button" data-act="mark" data-key="' + esc(c.key) + '" aria-label="' + markLabel(st) + '" title="' + markLabel(st) + '">' + mark(st) + '</button>' +
            (canSpeak ? '<button class="row__speak" type="button" data-act="say" data-text="' + esc(c.de) + '" aria-label="Послушать: ' + esc(c.de) + '">' + ICON.speak + '</button>' : '<span></span>') +
            '</li>';
        }).join('') + '</ul>' +
        '</section>';
    }).join('');
    $('#list').innerHTML = shown ? html :
      '<p class="empty"><b>Ничего не нашлось</b>' + (D.q.trim() ? 'Попробуй другое слово или сними фильтр.' : 'В этой стопке пока нет слов.') + '</p>';
  }
  function toggleKnown(el) {
    const key = el.dataset.key;
    const card = CARDS.find((c) => c.key === key);
    if (!card) return;
    if (statusOf(card) === 'ok') delete store.prog[key];
    else {
      const r = store.prog[key] || { n: 0, c: 0, x: 0, s: 0, h: 0, t: 0, a: 0 };
      r.n = Math.max(1, r.n);
      r.s = Math.max(2, r.s);
      r.h = 0;
      r.t = Date.now();
      store.prog[key] = r;
    }
    save();
    const st = statusOf(card);
    $$('.row__mark').filter((b) => b.dataset.key === key).forEach((b) => {
      b.innerHTML = mark(st);
      b.setAttribute('aria-label', markLabel(st));
      b.title = markLabel(st);
    });
    paintFilters();
    announce(card.de + ': ' + STATUS[st].toLowerCase());
  }

  /* ---------- Настройки ---------- */
  function openSettings() {
    paintSettings(false);
    if (sheet.open) return;
    if (typeof sheet.showModal === 'function') sheet.showModal(); else sheet.setAttribute('open', '');
  }
  function closeSettings() {
    if (typeof sheet.close === 'function') sheet.close(); else sheet.removeAttribute('open');
  }
  function paintSettings(asking) {
    const set = store.set;
    const radio = (name, value, label, checked) =>
      '<label><input type="radio" name="' + name + '" value="' + value + '"' + (checked ? ' checked' : '') + '><span>' + label + '</span></label>';
    sheet.innerHTML =
      '<div class="label sheet__paper"><div class="sheet__in">' +
        '<div class="sheet__head"><h2 id="settings-title">Настройки</h2>' +
          '<button class="iconbtn" type="button" data-act="close-settings" aria-label="Закрыть">' + ICON.close + '</button></div>' +
        '<fieldset class="field"><legend>Что на лицевой стороне</legend>' +
          '<div class="seg seg--stack">' +
            radio('dir', 'de', 'Немецкое слово', set.dir === 'de') +
            radio('dir', 'ru', 'Русский перевод', set.dir === 'ru') +
            radio('dir', 'mix', 'Вперемешку', set.dir === 'mix') +
          '</div>' +
          '<p class="field__hint">Работает в карточках и в тесте.</p>' +
        '</fieldset>' +
        '<fieldset class="field"><legend>Слов за один подход</legend>' +
          '<div class="seg">' + SIZES.map((n) => radio('size', n, n, set.size === n)).join('') + '</div>' +
        '</fieldset>' +
        '<div class="field"><p class="field__name">Озвучка</p>' +
          '<label class="switch"><span class="switch__text">Произносить немецкое слово вслух</span>' +
            '<input type="checkbox" name="speak"' + (set.speak && canSpeak ? ' checked' : '') + (canSpeak ? '' : ' disabled') + '><span class="switch__box" aria-hidden="true"></span></label>' +
          (canSpeak ? '' : '<p class="field__hint">В этом браузере озвучка недоступна.</p>') +
        '</div>' +
        '<div class="field"><p class="field__name">Прогресс</p>' +
          '<p class="field__hint">' + (persistent ? 'Хранится только в этом браузере. Чтобы перенести на другое устройство, сохрани его в файл и загрузи там.' : 'В этом окне браузер не даёт сохранять данные, прогресс пропадёт вместе со страницей.') + '</p>' +
          '<div class="sheet__row sheet__row--files">' +
            '<button class="btn btn--small btn--black" type="button" data-act="export">Сохранить в файл</button>' +
            '<button class="btn btn--small btn--black" type="button" data-act="import">Загрузить из файла</button>' +
          '</div>' +
          '<input type="file" id="file" accept="application/json,.json" hidden>' +
          (asking
            ? '<div class="confirm" role="alert"><p>Сбросить весь прогресс? Вернуть его будет нельзя.</p>' +
                '<div class="sheet__row"><button class="btn btn--small" type="button" data-act="reset-no">Оставить</button>' +
                '<button class="btn btn--small btn--black" type="button" data-act="reset-yes">Сбросить</button></div></div>'
            : '<button class="linkbtn" type="button" data-act="reset-ask">Сбросить прогресс</button>') +
        '</div>' +
      '</div></div>';
    if (asking) {
      const no = $('[data-act="reset-no"]', sheet);
      if (no) no.focus();
    }
  }
  sheet.addEventListener('change', (e) => {
    const el = e.target;
    if (el.name === 'dir') store.set.dir = el.value;
    else if (el.name === 'size') store.set.size = +el.value;
    else if (el.name === 'speak') {
      store.set.speak = el.checked;
      if (el.checked) say('Guten Tag!');
    } else if (el.id === 'file') {
      importFile(el.files && el.files[0]);
      return;
    } else return;
    save();
  });
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSettings(); });
  sheet.addEventListener('close', () => { if (route === 'home' || route === 'dict') render(false); });

  function exportFile() {
    try {
      const blob = new Blob([JSON.stringify(store, null, 1)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'wortapotheke-' + dayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      toast('Файл с прогрессом сохранён');
    } catch (e) { toast('Не получилось сохранить файл'); }
  }
  function importFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onerror = () => toast('Не получилось прочитать файл');
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || typeof data !== 'object' || typeof data.prog !== 'object') throw new Error('format');
        store = adopt(data);
        save();
        paintSettings(false);
        toast('Прогресс загружен');
      } catch (e) { toast('Это не файл с прогрессом Wortapotheke'); }
    };
    reader.readAsText(file);
  }
  function resetAll() {
    const keep = store.set;
    store = blank();
    store.set = keep;
    save();
    paintSettings(false);
    toast('Прогресс сброшен');
  }

  /* ---------- Действия ---------- */
  const ACT = {
    settings: openSettings,
    'close-settings': closeSettings,
    topic: toggleTopic,
    start: (el) => startMode(el.dataset.mode),
    exit: exitPlay,
    home: goHome,
    flip: flip,
    yes: () => answerCard(true),
    no: () => answerCard(false),
    undo: undoCard,
    say: (el) => say(el.dataset.text),
    pick: (el) => pickOption(+el.dataset.i),
    next: next,
    giveup: () => checkWritten(true),
    umlaut: (el) => typeChar(el.dataset.ch),
    caps: () => {
      S.q.caps = !S.q.caps;
      $('#umlauts').innerHTML = umlautKeys(S.q.caps);
      const input = $('#answer');
      if (input) input.focus({ preventScroll: true });
    },
    article: (el) => pickArticle(el.dataset.a),
    pair: pickPair,
    retry: retryMisses,
    again: playAgain,
    same: (el) => sameWords(el.dataset.type),
    filter: (el) => { D.filter = el.dataset.f; paintFilters(); paintList(); },
    mark: toggleKnown,
    export: exportFile,
    import: () => { const f = $('#file'); if (f) f.click(); },
    'reset-ask': () => paintSettings(true),
    'reset-no': () => paintSettings(false),
    'reset-yes': resetAll
  };
  document.addEventListener('click', (e) => {
    /* внутренние ссылки ведём сами — так сайт работает и в окне предпросмотра */
    const link = e.target.closest('a[href^="#/"]');
    if (link && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.button) {
      e.preventDefault();
      const to = link.getAttribute('href') === '#/dict' ? 'dict' : 'home';
      if (to !== route) go(to, false); else window.scrollTo({ top: 0, behavior: calm.matches ? 'auto' : 'smooth' });
      return;
    }
    /* closest() берёт ближайший элемент с действием: кнопка «послушать» внутри карточки её не перевернёт */
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'write') {
      e.preventDefault();
      checkWritten(false);
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'q') {
      D.q = e.target.value;
      paintList();
    }
  });
  /* буквы с умлаутами не должны отбирать фокус у поля */
  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('.umlaut')) e.preventDefault();
  });

  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey || sheet.open || route !== 'play' || !S) return;
    const k = e.key;
    const el = e.target;
    const tag = el && el.tagName;
    const onButton = tag === 'BUTTON' || tag === 'A';
    const typing = tag === 'INPUT' || tag === 'TEXTAREA';
    const press = k === 'Enter' || k === ' ' || k === 'Spacebar';

    if (k === 'Escape') { e.preventDefault(); exitPlay(); return; }

    if (S.type === 'cards') {
      if (press || k === 'ArrowUp' || k === 'ArrowDown') {
        if (press && onButton) return;          // кнопка сама сработает
        e.preventDefault();
        flip();
      } else if (k === 'ArrowRight' || k === '2') { e.preventDefault(); answerCard(true); }
      else if (k === 'ArrowLeft' || k === '1') { e.preventDefault(); answerCard(false); }
      else if (k === 'Backspace') { e.preventDefault(); undoCard(); }
      return;
    }
    if (S.type === 'quiz') {
      if (/^[1-4]$/.test(k)) { e.preventDefault(); pickOption(+k - 1); }
      else if (press && !onButton && S.q && S.q.done) { e.preventDefault(); next(); }
      return;
    }
    if (S.type === 'art') {
      if (/^[1-3]$/.test(k)) { e.preventDefault(); pickArticle(['der', 'die', 'das'][+k - 1]); }
      else if (press && !onButton && S.q && S.q.done) { e.preventDefault(); next(); }
      return;
    }
    if (S.type === 'write') {
      if (k === 'Enter' && !typing && !onButton && S.q && S.q.done) { e.preventDefault(); next(); }
    }
  });

  if (wide.addEventListener) wide.addEventListener('change', () => { if (route === 'home' && !sheet.open) render(false); });

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => fitAll(view), 120);
  });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitAll(view));

  /* ---------- Старт ---------- */
  (function drawKreuz() {
    let dots = '';
    for (let y = 0; y < 9; y++) {
      for (let x = 0; x < 9; x++) {
        if ((x > 2 && x < 6) || (y > 2 && y < 6)) {
          dots += '<circle cx="' + (x * 3 + 1.5) + '" cy="' + (y * 3 + 1.5) + '" r="1.05" style="--d:' + (x + y) + '"/>';
        }
      }
    }
    const el = $('#kreuz');
    if (el) el.innerHTML = '<svg viewBox="0 0 27 27">' + dots + '</svg>';
  })();

  route = parseRoute();
  render(true);

  /* Офлайн: страница кладётся в кэш и открывается без сети */
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* без офлайна */ }
  }
})();
</script>
</body>
</html>
